[package]
name = "quacklake-native-probe"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ducklake-storage = { path = "../../vendor/datafusion-ducklake-provider/crates/ducklake-storage", default-features = false, features = ["quack"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "time"] }
serde_json = "1"
datafusion-ducklake-provider = { path = "../../vendor/datafusion-ducklake-provider/crates/datafusion-ducklake", default-features = false, features = ["quack"] }
object_store = { version = "=0.13.2", features = ["fs"] }
futures-util = "0.3"
ducklake-catalog = { path = "../../vendor/datafusion-ducklake-provider/crates/ducklake-catalog" }

[profile.dev]
debug = 0
incremental = false

[patch."https://github.com/guybedford/libc"]
libc = { path = "../../vendor/libc" }
[patch."https://github.com/rust-lang/libc"]
libc = { path = "../../vendor/libc" }
[patch.crates-io]
libc = { path = "../../vendor/libc" }
reqwest = { path = "../../vendor/reqwest" }
ring = { path = "../../vendor/ring" }
object_store = { path = "../../vendor/object_store" }
datafusion-datasource-json = { path = "../../vendor/datafusion-datasource-json" }
datafusion-datasource-csv = { path = "../../vendor/datafusion-datasource-csv" }
datafusion-datasource-arrow = { path = "../../vendor/datafusion-datasource-arrow" }
tokio = { git = "https://github.com/guybedford/tokio", rev = "7227f2d72739c3bc9821074cc704e7582be92907" }
tokio-macros = { git = "https://github.com/guybedford/tokio", rev = "7227f2d72739c3bc9821074cc704e7582be92907" }
mio = { path = "../../vendor/mio" }
